<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    
    <!-- 图片框渐变 -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="100"/>
  
  <!-- 主体图标组 -->
  <g transform="translate(106, 106)">
    <!-- 左上角图片 - 带阴影 -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="140" height="140" rx="16" fill="url(#cardGradient)"/>
      <!-- 图片内容 -->
      <circle cx="45" cy="45" r="18" fill="#3b82f6" opacity="0.2"/>
      <circle cx="45" cy="45" r="10" fill="#3b82f6" opacity="0.6"/>
      <rect x="20" y="80" width="100" height="12" rx="6" fill="#e2e8f0"/>
      <rect x="20" y="100" width="80" height="12" rx="6" fill="#e2e8f0"/>
      <rect x="20" y="120" width="60" height="8" rx="4" fill="#cbd5e1"/>
    </g>
    
    <!-- 右上角图片 -->
    <g filter="url(#shadow)">
      <rect x="160" y="0" width="140" height="140" rx="16" fill="url(#cardGradient)"/>
      <!-- 图片内容 -->
      <rect x="180" y="20" width="100" height="60" rx="8" fill="#3b82f6" opacity="0.15"/>
      <rect x="190" y="30" width="30" height="30" rx="4" fill="#3b82f6" opacity="0.4"/>
      <rect x="230" y="30" width="40" height="15" rx="4" fill="#3b82f6" opacity="0.3"/>
      <rect x="230" y="50" width="35" height="10" rx="4" fill="#3b82f6" opacity="0.25"/>
      <rect x="180" y="95" width="100" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="180" y="113" width="70" height="10" rx="5" fill="#cbd5e1"/>
    </g>
    
    <!-- 左下角图片 -->
    <g filter="url(#shadow)">
      <rect x="0" y="160" width="140" height="140" rx="16" fill="url(#cardGradient)"/>
      <!-- 图片内容 - 柱状图风格 -->
      <rect x="25" y="200" width="20" height="60" rx="4" fill="#3b82f6" opacity="0.4"/>
      <rect x="55" y="210" width="20" height="50" rx="4" fill="#3b82f6" opacity="0.5"/>
      <rect x="85" y="190" width="20" height="70" rx="4" fill="#3b82f6" opacity="0.6"/>
      <rect x="20" y="275" width="100" height="10" rx="5" fill="#e2e8f0"/>
    </g>
    
    <!-- 右下角图片 -->
    <g filter="url(#shadow)">
      <rect x="160" y="160" width="140" height="140" rx="16" fill="url(#cardGradient)"/>
      <!-- 图片内容 - 网格风格 -->
      <rect x="180" y="180" width="45" height="45" rx="6" fill="#3b82f6" opacity="0.25"/>
      <rect x="235" y="180" width="45" height="45" rx="6" fill="#3b82f6" opacity="0.35"/>
      <rect x="180" y="235" width="45" height="45" rx="6" fill="#3b82f6" opacity="0.3"/>
      <rect x="235" y="235" width="45" height="45" rx="6" fill="#3b82f6" opacity="0.4"/>
    </g>
    
    <!-- 中心加号装饰 - 代表"拼接" -->
    <g transform="translate(150, 150)" opacity="0.9">
      <circle cx="0" cy="0" r="28" fill="white" filter="url(#shadow)"/>
      <circle cx="0" cy="0" r="24" fill="#3b82f6"/>
      <rect x="-12" y="-3" width="24" height="6" rx="3" fill="white"/>
      <rect x="-3" y="-12" width="6" height="24" rx="3" fill="white"/>
    </g>
  </g>
</svg>

